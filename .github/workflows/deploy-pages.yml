name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: quiz/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Copy the static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/quiz/' \
            --exclude='/_site/' \
            ./ _site/

      - name: Install quiz dependencies
        working-directory: quiz
        run: npm ci

      - name: Build quiz into the published site
        working-directory: quiz
        run: npm run build -- --outDir ../_site/quiz --emptyOutDir

      - name: Verify compiled quiz output
        working-directory: quiz
        run: |
          test -f ../_site/quiz/index.html
          test -d ../_site/quiz/assets
          grep -Eq '<script[^>]+src="\./assets/index-[^"]+\.js"' ../_site/quiz/index.html
          if grep -q 'src/main.jsx' ../_site/quiz/index.html; then
            echo "Quiz output still references the uncompiled JSX entry point."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
