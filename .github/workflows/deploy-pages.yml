name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: courses/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Copy the static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/courses/' \
            --exclude='/_site/' \
            ./ _site/

      - name: Install course app dependencies
        working-directory: courses
        run: npm ci

      - name: Build course app into the published site
        working-directory: courses
        run: npm run build -- --outDir ../_site/courses --emptyOutDir

      - name: Verify compiled course output
        working-directory: courses
        run: |
          test -f ../_site/courses/index.html
          test -d ../_site/courses/assets
          test -f ../_site/courses/sql-visual-lab/index.html
          test -f ../_site/courses/sql-visual-lab/app.js
          test -f ../_site/courses/sql-visual-lab/engine.js
          test -f ../_site/courses/sql-visual-lab/worker.js
          test -f ../_site/courses/sql-visual-lab/vendor/sql-wasm.js
          test -f ../_site/courses/sql-visual-lab/vendor/sql-wasm.wasm
          test -f ../_site/courses/sql-visual-lab/vendor/mysql.umd.js
          test -f ../_site/courses/sql-visual-lab/schema.sql
          test -f ../_site/courses/sql-visual-lab/challenges.json
          grep -Eq '<script[^>]+src="\./assets/index-[^"]+\.js"' ../_site/courses/index.html
          if grep -q 'src/main.jsx' ../_site/courses/index.html; then
            echo "Course output still references the uncompiled JSX entry point."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
