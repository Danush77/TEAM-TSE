<!doctype html><meta charset="utf-8"><title>Worker smoke</title><pre id="status">starting</pre>
<script>
const status = document.querySelector('#status')
const worker = new Worker('./worker.js')
let nextId = 0
const pending = new Map()
worker.addEventListener('message', ({ data }) => {
  status.textContent += `\nmessage ${JSON.stringify(data)}`
  const resolve = pending.get(data.requestId)
  if (resolve) { pending.delete(data.requestId); resolve(data) }
})
worker.addEventListener('error', (event) => { status.textContent += `\nworker error ${event.message} ${event.filename}:${event.lineno}` })
const request = (type, payload = {}) => new Promise((resolve) => {
  const requestId = ++nextId
  pending.set(requestId, resolve)
  worker.postMessage({ requestId, type, payload })
})
fetch('./schema.sql').then((response) => response.text()).then(async (schemaSql) => {
  const init = await request('init', { schemaSql })
  if (!init.ok) return
  await request('run', { sql: 'SELECT name FROM employees ORDER BY id LIMIT 2' })
  await request('run', { sql: 'DELETE FROM employees' })
  await request('run', { sql: 'SELECT 1; DELETE FROM employees' })
})
setTimeout(() => { status.textContent += '\nprobe timed out'; worker.terminate() }, 12000)
</script>
